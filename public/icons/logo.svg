<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepFlowFullGrad" x1="4" y1="48" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="stepFlowTextGrad" x1="64" y1="28" x2="190" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Left 48x48) -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="14" fill="#0C1017" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    
    <!-- Step 1 -->
    <path d="M 11 32 C 11 30.6 12.1 29.5 13.5 29.5 L 20 29.5 C 21.4 29.5 22.5 30.6 22.5 32 L 22.5 33 C 22.5 34.4 21.4 35.5 20 35.5 L 13.5 35.5 C 12.1 35.5 11 34.4 11 33 Z" fill="#4F46E5" opacity="0.8" />
    
    <!-- Step 2 -->
    <path d="M 18 23 C 18 21.6 19.1 20.5 20.5 20.5 L 28 20.5 C 29.4 20.5 30.5 21.6 30.5 23 L 30.5 24 C 30.5 25.4 29.4 26.5 28 26.5 L 20.5 26.5 C 19.1 26.5 18 25.4 18 24 Z" fill="#6366F1" />

    <!-- Step 3 & Apex Arrow -->
    <path d="M 25 14 C 25 12.6 26.1 11.5 27.5 11.5 L 36 11.5 A 1.5 1.5 0 0 1 37.5 13 L 37.5 21.5 C 37.5 22.9 36.4 24 35 24 L 33.5 24 C 32.1 24 31 22.9 31 21.5 L 31 16 L 27.5 16 C 26.1 16 25 14.9 25 13.5 Z" fill="url(#stepFlowFullGrad)" />

    <!-- Flow Dynamic Line -->
    <path d="M 14 32.5 L 24 23.5 L 34.5 14" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Apex Spark Node -->
