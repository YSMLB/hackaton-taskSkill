  <!-- Typography: StepFlow -->
  <text x="64" y="36" font-family="'Montserrat', 'Manrope', 'Inter', sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5" fill="url(#stepFlowTextGrad)">StepFlow</text>

  <!-- Typography: .ai Badge -->
  <g transform="translate(182, 19)">
    <rect width="32" height="20" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" />
    <text x="6" y="14" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#818CF8">.ai</text>
  </g>
