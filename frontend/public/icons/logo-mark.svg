<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Flow Gradient -->
    <linearGradient id="stepFlowGradPrimary" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="stepFlowGradAccent" x1="16" y1="48" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Shadow Glow -->
    <filter id="stepFlowGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container Background -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0C1017" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Subtle Internal Radial Depth -->
  <circle cx="32" cy="32" r="24" fill="url(#stepFlowGradPrimary)" opacity="0.12" />

  <!-- The StepFlow Glyph: 3 Ascending Stepping Planes Intersecting into a Forward Velocity Chevron -->
  <!-- Tier 1: Foundation Step (Left) -->
  <path d="M 15 42 C 15 40.34 16.34 39 18 39 L 26 39 C 27.66 39 29 40.34 29 42 L 29 43 C 29 44.66 27.66 46 26 46 L 18 46 C 16.34 46 15 44.66 15 43 Z" 
        fill="#4F46E5" opacity="0.75" />

  <!-- Tier 2: Acceleration Flow (Center Ribbon) -->
  <path d="M 23 31 C 23 29.34 24.34 28 26 28 L 36 28 C 37.66 28 39 29.34 39 31 L 39 32 C 39 33.66 37.66 35 36 35 L 26 35 C 24.34 35 23 33.66 23 32 Z" 
        fill="#6366F1" />

  <!-- Tier 3 & Apex Flow Arrow: Ascending Step to Forward Peak -->
  <path d="M 31 20 C 31 18.34 32.34 17 34 17 L 45 17 A 2 2 0 0 1 47 19 L 47 30 C 47 31.66 45.66 33 44 33 L 42 33 C 40.34 33 39 31.66 39 30 L 39 23 L 34 23 C 32.34 23 31 21.66 31 20 Z" 
        fill="url(#stepFlowGradPrimary)" filter="url(#stepFlowGlow)" />

  <!-- Continuous Dynamic Flow Trace (Connecting All 3 Steps) -->
  <path d="M 18 42.5 L 30 31.5 L 43 19" 
        stroke="url(#stepFlowGradAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Intelligence Core Node (Apex Spark) -->
  <circle cx="43" cy="19" r="3.5" fill="#FFFFFF" />
  <circle cx="43" cy="19" r="6" stroke="#06B6D4" stroke-width="1.5" opacity="0.6" />
</svg>
