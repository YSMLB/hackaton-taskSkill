services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stepflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STEPFLOW_DB_PATH=/app/.stepflow/stepflow.sqlite
    volumes:
      - workspace-data:/app/.stepflow
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  stepflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stepflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  workspace-data:
